<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tedarikçi PPAP Portalı — Sanifoam</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="katalog.js?v=13"></script>
<script src="sablon.js?v=13"></script>
<style>
:root{
  --antet:#123a6b; --antet2:#1b5fa8; --zemin:#f1f5f9; --kart:#fff;
  --kenar:#dbe3ec; --soluk:#64748b; --metin:#0f172a;
  --ok:#15803d; --ok-bg:#dcfce7; --uyari:#b45309; --uyari-bg:#fef3c7;
  --sil:#b91c1c; --sil-bg:#fee2e2; --bilgi:#1d4ed8; --bilgi-bg:#dbeafe;
}
*{box-sizing:border-box}
body{margin:0;background:var(--zemin);color:var(--metin);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px}
.ust{background:linear-gradient(100deg,var(--antet),var(--antet2));color:#fff;padding:11px 16px}
.ust-satir{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.marka{background:#fff;color:var(--antet);font-weight:700;padding:5px 12px;border-radius:8px}
.baslik{font-weight:600;font-size:15px}
.kim{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12.5px}
.cip{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.25);
  border-radius:7px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.cip:hover{background:rgba(255,255,255,.24)}
.govde{padding:16px;max-width:1180px;margin:0 auto}
.kart{background:var(--kart);border:1px solid var(--kenar);border-radius:11px;padding:16px 18px;
  margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14.5px;margin:0 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--soluk);font-weight:600;padding:7px 9px;
  border-bottom:1px solid var(--kenar);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid #eef2f7;vertical-align:top}
tr:last-child td{border-bottom:0}
.dugme{background:var(--antet2);color:#fff;border:0;border-radius:7px;padding:8px 15px;
  cursor:pointer;font-size:13px;font-family:inherit;font-weight:600}
.dugme.duz{background:#fff;color:var(--metin);border:1px solid var(--kenar);font-weight:500}
.dugme.kucuk{padding:5px 10px;font-size:12px}
.dugme:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--kenar);border-radius:7px;
  font-size:13px;font-family:inherit;background:#fff;color:var(--metin)}
textarea{min-height:62px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px;color:#334155}
.satirlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.rozet{font-size:11.5px;border-radius:20px;padding:2px 9px;white-space:nowrap;font-weight:600}
.r-bekliyor{background:#eceff3;color:var(--soluk)}
.r-yuklendi{background:var(--bilgi-bg);color:var(--bilgi)}
.r-kabul{background:var(--ok-bg);color:var(--ok)}
.r-red{background:var(--sil-bg);color:var(--sil)}
.r-hazirlik{background:#eceff3;color:var(--soluk)}
.r-tedarikcide{background:var(--uyari-bg);color:var(--uyari)}
.r-incelemede{background:var(--bilgi-bg);color:var(--bilgi)}
.r-onayli{background:var(--ok-bg);color:var(--ok)}
.grup-bas{background:#f8fafc;font-weight:650;font-size:13px}
.ilerleme{background:#e3eefb;border-radius:8px;height:10px;overflow:hidden;margin:6px 0}
.ilerleme > div{height:100%;background:linear-gradient(90deg,#4CAF50,#2e7d32)}
.perde{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;
  align-items:center;justify-content:center;padding:18px}
.pencere{background:#fff;border-radius:12px;width:100%;max-width:620px;padding:20px 22px;
  max-height:90vh;overflow:auto}
.dugmeler{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.dugmeler .sag{margin-left:auto}
.bilgi-kutu{background:#eef4fa;border-left:4px solid var(--antet2);border-radius:9px;
  padding:10px 13px;font-size:12.5px;margin:8px 0}
.uyari-kutu{background:var(--uyari-bg);border-left:4px solid var(--uyari);border-radius:9px;
  padding:10px 13px;font-size:12.5px;margin:8px 0}
.soluk{color:var(--soluk);font-size:12px}
.giris{max-width:380px;margin:9vh auto;background:#fff;border:1px solid var(--kenar);
  border-radius:14px;padding:26px}
.giris .marka{display:inline-block;background:var(--antet);color:#fff;margin-bottom:14px}
#mesaj{margin:0 auto 10px;max-width:1180px;padding:0 16px;font-size:13px}
#mesaj:empty{display:none}
.dosya{display:flex;align-items:center;gap:7px;font-size:12px;margin-top:3px}
/* PPAP element no — VDA numarasinin yanindaki ikinci numara */
.ppapno{text-align:center;white-space:nowrap}
.ppapno span{display:inline-block;min-width:22px;background:#ede7f6;color:#5e35b1;
  border-radius:6px;padding:1px 7px;font-weight:700;font-size:12px;cursor:help}
.ppapno .t42{min-width:16px;margin-left:3px;padding:1px 5px;font-size:11px}
.t42-s{background:var(--ok-bg);color:var(--ok)}
.t42-r{background:#eceff3;color:var(--soluk)}
.t42-y{background:var(--uyari-bg);color:var(--uyari)}
.suruk{border:2px dashed #b3d4f5;background:#fafcff;border-radius:8px;padding:12px;
  text-align:center;color:#5b7fa6;font-size:12.5px;cursor:pointer;margin-top:6px}
/* Kapsam renkleri: gonderilecek / yalniz gerekli */
.sat-gonder td{background:#f1faf2}
.sat-gerekli td{background:#fdf9ee}
</style></head>
<body>

<div id="giris" class="giris" style="display:none">
  <div class="marka">Sanifoam</div>
  <h2 id="g_baslik">Tedarikçi PPAP Portalı</h2>
  <div class="soluk" id="g_alt">PPAP / VDA 2 belge sunumu.</div>
  <div id="g_davet" class="bilgi-kutu" style="display:none"></div>
  <label>E-posta</label><input id="g_mail" type="email" autocomplete="username">
  <label>Şifre</label><input id="g_sifre" type="password" autocomplete="current-password">
  <div id="g_sifre2kutu" style="display:none">
    <label>Şifre (tekrar)</label><input id="g_sifre2" type="password" autocomplete="new-password">
  </div>
  <div class="dugmeler"><button class="dugme" style="flex:1" id="g_btn">Giriş yap</button></div>
  <div id="g_alt2" class="soluk" style="margin-top:10px;text-align:center"></div>
  <div class="soluk" style="margin-top:6px;text-align:center">
    <a href="#" id="g_sifirla">Şifrenizi mi unuttunuz?</a></div>
  <div id="g_hata" class="uyari-kutu" style="display:none"></div>
</div>

<div id="uygulama" style="display:none">
  <div class="ust"><div class="ust-satir">
    <div class="marka">Sanifoam</div>
    <div class="baslik">Tedarikçi PPAP Portalı</div>
    <div class="kim"><span id="kimlik"></span>
      <button class="cip" onclick="cikis()">Çıkış</button></div>
  </div></div>
  <div id="mesaj"></div>
  <div class="govde" id="govde"></div>
</div>

<script>
// ── Bağlantılar ──────────────────────────────────────────────────────────
// Kimlik + PPAP verisi ERP giris projesinde (kurallar auth.uid() ile calissin).
const SB_URL = 'https://chchaielttnimuuezazb.supabase.co';
const SB_KEY = 'sb_publishable_S2ywbq7TkgcZKiVif3td-A_oAuQL3QT';
// Onayli tedarikci listesi ayri projede duruyor — yalniz OKUNUR.
const PT_URL = 'https://nnubrxbpthmkitueixbh.supabase.co';
const PT_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5udWJyeGJwdGhta2l0dWVpeGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjI2MDIsImV4cCI6MjA5NjEzODYwMn0.CHZUOylf_q8kkOQbFf9VWZ6-doUTlynmAhahM2EuImE';
// Dosyalar Drive'da (tedarikci sistemiyle ayni Apps Script) — Supabase sismesin.
const DRIVE_URL = 'https://script.google.com/macros/s/AKfycby2nGHzpjJWEe-By16Urj865sLLvowSUPZC4_HyvCCzU4fyRwy6pXbfU3AumHwYMlWs_A/exec';
const DRIVE_SECRET = 'Sanifoam2026Drive';

const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true } });
const $ = s => document.querySelector(s);
const met = v => (v === null || v === undefined) ? '' : String(v);
const kacir = t => met(t).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const kb = n => n > 1048576 ? (n/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n/1024)) + ' KB';
function mesaj(m, tur) {
  $('#mesaj').innerHTML = m ? '<div class="' + (tur === 'hata' ? 'uyari-kutu' : 'bilgi-kutu') + '">'
    + m + '</div>' : '';
  if (m) setTimeout(() => { if ($('#mesaj').innerHTML.indexOf(m) >= 0) $('#mesaj').innerHTML = ''; }, 6000);
}
const DURUM_AD = { hazirlik:'Hazırlık', tedarikcide:'Tedarikçide', incelemede:'İncelemede',
                   onayli:'Onaylı', red:'Reddedildi' };
const MADDE_AD = { bekliyor:'Bekliyor', yuklendi:'Yüklendi', kabul:'Kabul', red:'Red' };

let BEN = null;        // { eposta, ic:bool, tedarikci:'' }

// ── Giriş / davet ────────────────────────────────────────────────────────
// DAVET: kalite bir link uretir (?davet=<kod>). Tedarikci linki acar, KENDI
// sifresini belirler; kod onu dogru tedarikciye baglar ve bir daha
// kullanilamaz. Boylece hesap acma/sifre iletme isi ortadan kalkar.
const DAVET = new URLSearchParams(location.search).get('davet') || '';
let DAVET_FIRMA = '';

async function basla() {
  if (DAVET) {
    try {
      const r = await sb.rpc('ppap_davet_bilgi', { p_kod: DAVET });
      DAVET_FIRMA = (r && r.data) || '';
    } catch (e) {}
  }
  // Oturum SUNUCUYA sorulur: localStorage'da eski/suresi dolmus bir oturum
  // kalmis olabilir; onunla davet kullanilinca sunucu kimligi gormuyor ve
  // "once giris yapmalisiniz" gibi yaniltici bir hata cikiyordu.
  let oturum = null;
  try {
    const { data: o } = await sb.auth.getSession();
    if (o.session) {
      const { data: u, error: ue } = await sb.auth.getUser();
      if (!ue && u && u.user) oturum = o.session;
      else await sb.auth.signOut();     // gecersiz oturumu temizle
    }
  } catch (e) { try { await sb.auth.signOut(); } catch (e2) {} }

  if (oturum) {
    if (DAVET && DAVET_FIRMA) { await davetiKullan(oturum); return; }
    await kimlikBelirle(oturum);
    return;
  }
  girisEkraniniKur();
  $('#giris').style.display = 'block';
}

function girisEkraniniKur() {
  const b = $('#g_baslik'), alt = $('#g_alt'), kutu = $('#g_davet'), btn = $('#g_btn');
  if (DAVET && DAVET_FIRMA) {
    b.textContent = 'Hesap oluşturun';
    alt.textContent = 'Sanifoam PPAP portalına ilk kez giriyorsunuz.';
    kutu.style.display = 'block';
    kutu.innerHTML = '<b>' + kacir(DAVET_FIRMA) + '</b> adına davet edildiniz. '
      + 'Kendi e-postanızı yazın ve <b>şifrenizi siz belirleyin</b> — '
      + 'bu bilgileri kimseyle paylaşmayın.';
    $('#g_sifre2kutu').style.display = 'block';
    btn.textContent = 'Hesabı oluştur ve gir';
    $('#g_alt2').innerHTML = 'Zaten hesabınız varsa <a href="#" id="g_gecis">giriş yapın</a>.';
    setTimeout(() => {
      const g = document.getElementById('g_gecis');
      if (g) g.onclick = e => { e.preventDefault(); girisModunaGec(); };
    }, 0);
    btn.dataset.mod = 'kayit';
  } else if (DAVET && !DAVET_FIRMA) {
    kutu.style.display = 'block';
    kutu.className = 'uyari-kutu';
    kutu.textContent = 'Bu davet bağlantısı geçersiz, süresi dolmuş ya da daha önce '
      + 'kullanılmış. Sanifoam kalite bölümünden yeni bir bağlantı isteyin.';
  }
}

// Kayit ekranindan giris ekranina gecis — uc yerden cagriliyor.
function girisModunaGec() {
  $('#g_sifre2kutu').style.display = 'none';
  $('#g_baslik').textContent = 'Giriş yapın';
  const b = $('#g_btn');
  b.textContent = DAVET_FIRMA ? 'Giriş yap ve daveti kullan' : 'Giriş yap';
  b.dataset.mod = 'giris';
  $('#g_alt2').textContent = '';
}

async function davetiKullan(hazirOturum) {
  // Oturum daha yeni kuruldu; istemcinin yazmasi bir an gecikebiliyor.
  // Bu yuzden oturum CAGIRANDAN gelir; gelmezse birkac kez okunmaya
  // calisilir. Once tek denemede "oturum yok" deyip pes ediyordu.
  for (let deneme = 0; deneme < 4; deneme++) {
    let oturum = hazirOturum;
    if (!oturum) {
      const { data: o } = await sb.auth.getSession();
      oturum = o.session;
    }
    if (!oturum) {
      if (deneme < 3) { await new Promise(x => setTimeout(x, 700)); continue; }
      girisEkraniniKur();
      $('#giris').style.display = 'block';
      $('#g_hata').style.display = 'block';
      girisModunaGec();
      $('#g_hata').innerHTML = 'Oturum açılamadığı için davet henüz kullanılmadı.'
        + '<div style="margin-top:6px">Şifrenizi yazıp <b>Giriş yap</b>’a basın; '
        + 'hatırlamıyorsanız <b>“Şifrenizi mi unuttunuz?”</b> ile yenileyin. '
        + 'Davet bağlantısı geçerliliğini koruyor.</div>';
      return;
    }
    const r = await sb.rpc('ppap_davet_kullan', { p_kod: DAVET });
    if (!r.error) {
      history.replaceState({}, '', location.pathname);
      await kimlikBelirle(oturum);
      mesaj('✅ Hesabınız <b>' + kacir(r.data) + '</b> ile eşleştirildi.');
      return;
    }
    const kimlikSorunu = /giri[sş]|jwt|claim/i.test(r.error.message || '');
    if (!kimlikSorunu || deneme === 2) {
      girisEkraniniKur();
      $('#giris').style.display = 'block';
      $('#g_hata').style.display = 'block';
      $('#g_hata').innerHTML = kimlikSorunu
        ? 'Oturum sunucuya ulaşmadı. Sayfayı yenileyip (Ctrl+F5) aynı bilgilerle '
          + '<b>giriş yapın</b>; davet bağlantısı geçerliliğini koruyor.'
        : 'Davet kullanılamadı: ' + kacir(r.error.message);
      return;
    }
    await new Promise(x => setTimeout(x, 900));
  }
}
async function kimlikBelirle(oturum) {
  const eposta = oturum.user.email || '';
  let ic = false, tedarikci = '', neden = [];
  // ERP'de onayli hesap = ic kullanici (kalite). Sorgu hatasi ONCEDEN
  // sessizce yutuluyordu; artik sebebi ekranda yaziyor.
  // Kontrol RLS'e takilmasin diye sunucudaki islevle yapiliyor: erp_users
  // uzerindeki 'auth.uid() = id' kurali dogrudan sorguda satir dondurmuyordu
  // (istege kimlik ilismiyor gorunuyordu), islev security definer.
  const rk0 = await sb.rpc('ppap_kim');
  const kim = (rk0 && rk0.data) || {};
  if (rk0 && rk0.error) neden.push('ppap_kim: ' + rk0.error.message);
  ic = !!kim.erp_onayli;
  if (!ic) {
    if (!kim.uid) neden.push('oturum sunucuya ulaşmadı (uid yok)');
    else if (!kim.erp_kayit) neden.push('erp_users kaydı yok (uid ' + met(kim.uid).slice(0, 8) + '…)');
    else neden.push('ERP hesabı onaylı değil');
  }

  let bekliyor = null;
  if (!ic) {
    const rk = await sb.from('ppap_kullanici').select('tedarikci,aktif')
      .ilike('eposta', eposta).maybeSingle();
    if (rk.error) neden.push('ppap_kullanici: ' + rk.error.message);
    else if (rk.data && rk.data.aktif) tedarikci = rk.data.tedarikci;
    else if (rk.data) bekliyor = rk.data.tedarikci;   // kayit var, ONAY BEKLIYOR
    else neden.push('tedarikçi eşleşmesi yok');
  }
  // Davetle hesap acan tedarikci dogrudan giremez: kalite onaylayinca girer.
  if (bekliyor) {
    $('#giris').style.display = 'block';
    $('#g_baslik').textContent = 'Kaydınız alındı';
    $('#g_alt').textContent = '';
    $('#g_davet').style.display = 'block';
    $('#g_davet').className = 'bilgi-kutu';
    $('#g_davet').innerHTML = '<b>' + kacir(bekliyor) + '</b> adına kaydınız oluşturuldu.<br>'
      + 'Sanifoam kalite bölümünün <b>onayı</b> bekleniyor. Onaylandığında aynı '
      + 'e-posta ve şifreyle girebilirsiniz.';
    ['g_mail', 'g_sifre', 'g_sifre2kutu', 'g_btn', 'g_alt2'].forEach(x => {
      const el = document.getElementById(x); if (el) el.style.display = 'none';
    });
    document.querySelectorAll('#giris label').forEach(l => l.style.display = 'none');
    await sb.auth.signOut();
    return;
  }
  if (!ic && !tedarikci) {
    $('#giris').style.display = 'block';
    $('#g_hata').style.display = 'block';
    $('#g_hata').innerHTML = '<b>' + kacir(eposta) + '</b> PPAP portalına tanımlı değil.'
      + '<div class="soluk" style="margin-top:6px">Sebep: ' + kacir(neden.join(' · ')) + '</div>'
      + '<div class="soluk" style="margin-top:6px">Kalite bölümü için: ERP portalında hesabınızın '
      + '<b>onaylı</b> olması gerekir. Tedarikçi iseniz size gönderilen <b>davet bağlantısını</b> '
      + 'kullanın.</div>';
    await sb.auth.signOut();
    return;
  }
  BEN = { eposta, ic, tedarikci };
  $('#giris').style.display = 'none';
  $('#uygulama').style.display = 'block';
  $('#kimlik').textContent = eposta + (ic ? ' · Kalite' : ' · ' + tedarikci);
  ic ? icEkran() : tedEkran();
  // Onayli listeden ?ted= ile gelindiyse dogrudan yeni proje penceresi acilir.
  if (ic && new URLSearchParams(location.search).get('ted')) setTimeout(yeniProje, 400);
}
$('#g_btn').onclick = async () => {
  const e = $('#g_mail').value.trim(), p = $('#g_sifre').value;
  const kayit = $('#g_btn').dataset.mod === 'kayit';
  $('#g_hata').style.display = 'none';
  if (!e || !p) return;
  if (kayit) {
    if (p.length < 8) {
      $('#g_hata').style.display = 'block';
      $('#g_hata').textContent = 'Şifre en az 8 karakter olmalı.';
      return;
    }
    if (p !== $('#g_sifre2').value) {
      $('#g_hata').style.display = 'block';
      $('#g_hata').textContent = 'İki şifre aynı değil.';
      return;
    }
  }
  $('#g_btn').disabled = true;
  let r = kayit ? await sb.auth.signUp({ email: e, password: p })
                : await sb.auth.signInWithPassword({ email: e, password: p });
  // HESAP ZATEN VARSA: Supabase, e-posta sizdirmamak icin signUp'a hata
  // DEGIL, oturumsuz bir yanit dondurur. Bunu "dogrulama bekleniyor"
  // saymak yanlisti — ayni bilgilerle girisi deneyip devam ediyoruz.
  // HESAP ZATEN VARSA: Supabase iki turlu davranabiliyor —
  //   (a) hata: "User already registered"
  //   (b) hata yok ama oturum yok (e-posta sizdirmama davranisi)
  // Ikisinde de dogru hamle ayni: girilen sifreyle GIRIS denemek.
  if (kayit && ((r.error && /already registered|already exists|user_exists/i.test(r.error.message || ''))
                || (!r.error && !r.data.session))) {
    const g = await sb.auth.signInWithPassword({ email: e, password: p });
    if (!g.error && g.data.session) {
      r = g;
    } else {
      // Hesap var, sifre tutmadi: formu GIRIS moduna al ki ayni duvara
      // tekrar toslanmasin.
      girisModunaGec();
      $('#g_sifre').value = '';
      $('#g_sifre').focus();
      $('#g_btn').disabled = false;
      $('#g_hata').style.display = 'block';
      $('#g_hata').innerHTML = '<b>' + kacir(e) + '</b> için hesap zaten var — yenisini '
        + 'açmaya gerek yok.<div style="margin-top:6px">Şifrenizi yazıp <b>Giriş yap</b>’a '
        + 'basın; davet aynı anda kullanılacak. Hatırlamıyorsanız '
        + '<b>“Şifrenizi mi unuttunuz?”</b> ile yenileyin.</div>';
      return;
    }
  }
  $('#g_btn').disabled = false;
  if (r.error) {
    $('#g_hata').style.display = 'block';
    $('#g_hata').textContent = (kayit ? 'Hesap oluşturulamadı: ' : 'Giriş yapılamadı: ')
      + r.error.message;
    return;
  }
  if (!r.data.session) {
    $('#giris').style.display = 'block';
    $('#g_hata').style.display = 'block';
    girisModunaGec();
    $('#g_sifre').value = '';
    $('#g_hata').innerHTML = '<b>' + kacir(e) + '</b> için oturum açılamadı. '
      + 'Şifrenizi yazıp <b>Giriş yap</b>’a basın ya da '
      + '<b>“Şifrenizi mi unuttunuz?”</b> ile yenileyin.';
    return;
  }
  if (DAVET && DAVET_FIRMA) { await davetiKullan(r.data.session); return; }
  await kimlikBelirle(r.data.session);
};
$('#g_sifre').addEventListener('keydown', e => { if (e.key === 'Enter') $('#g_btn').click(); });

// Sifre sifirlama: hesap acilmis ama sifre hatirlanmiyorsa tek cikis yolu
// buydu — hesabi silmek ya da yeni davet uretmek gerekiyordu.
$('#g_sifirla').onclick = async e => {
  e.preventDefault();
  const mail = $('#g_mail').value.trim();
  if (!mail) { $('#g_mail').focus(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(mail, { redirectTo: location.href });
  $('#g_hata').style.display = 'block';
  $('#g_hata').innerHTML = error
    ? 'Sıfırlama postası gönderilemedi: ' + kacir(error.message)
    : '📧 <b>' + kacir(mail) + '</b> adresine şifre sıfırlama bağlantısı gönderildi. '
      + 'Yeni şifreyi belirledikten sonra bu sayfaya dönüp giriş yapın — '
      + 'davet bağlantısı geçerliliğini koruyor.';
};
async function cikis() { await sb.auth.signOut(); location.reload(); }

// ── Drive dosya katmanı ──────────────────────────────────────────────────
// Apps Script metin saklıyor: dosya base64 olarak JSON içinde tutulur
// (tedarikçi sisteminde de böyle). Supabase'de yalnız künye durur.
function driveAnahtar(projeId, maddeNo, ad) {
  return ('PPAP_' + projeId.slice(0, 8) + '_' + maddeNo + '_' + ad)
    .replace(/[^a-zA-Z0-9._-]/g, '_') + '.json';
}
async function driveYaz(anahtar, icerik) {
  await fetch(DRIVE_URL, { method:'POST', mode:'no-cors',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'save', secret: DRIVE_SECRET, name: anahtar, content: icerik }) });
  await new Promise(r => setTimeout(r, 1500));
}
function driveOku(anahtar) {
  return new Promise((cozum, hata) => {
    const cb = '__ppapcb_' + Date.now() + '_' + Math.floor(Math.random() * 1e5);
    const s = document.createElement('script');
    const zaman = setTimeout(() => { temizle(); hata(new Error('Zaman aşımı')); }, 60000);
    function temizle() { try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s); clearTimeout(zaman); }
    window[cb] = d => { temizle(); (d && d.success) ? cozum(d.content) : hata(new Error((d && d.error) || 'okunamadı')); };
    s.src = DRIVE_URL + '?action=getfile&name=' + encodeURIComponent(anahtar)
      + '&secret=' + encodeURIComponent(DRIVE_SECRET) + '&callback=' + cb;
    s.onerror = () => { temizle(); hata(new Error('Drive bağlantı hatası')); };
    document.body.appendChild(s);
  });
}
async function dosyaAc(f) {
  mesaj('📥 ' + kacir(f.ad) + ' açılıyor…');
  try {
    const ham = await driveOku(f.anahtar);
    const veri = JSON.parse(ham);
    const b = await (await fetch(veri.veri)).blob();
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = f.ad; document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 4000);
    mesaj('');
  } catch (e) { mesaj('Dosya açılamadı: ' + e.message, 'hata'); }
}
function dosyaOku(file) {
  return new Promise(r => { const fr = new FileReader();
    fr.onloadend = () => r(fr.result); fr.readAsDataURL(file); });
}

// Madde adina tiklaninca: ne isteniyor + ornek belgeler.
function maddeBilgi(no) {
  const m = (VDA2.maddeler || []).find(x => x.no === no);
  if (!m) return;
  const pp = m.ppap || '';
  const kod = pp ? (((VDA2.tablo42 || {})[pp] || {})[AKTIF_SEVIYE || '3'] || '') : '';
  const KOD_ACIK = { S: 'Bu seviyede müşteriye GÖNDERİLİR.',
                     R: 'Bu seviyede tedarikçide TUTULUR; istenirse gösterilir.',
                     '*': 'Bu seviyede tedarikçide tutulur; müşteri isterse gönderilir.' };
  const p = document.createElement('div');
  p.className = 'perde';
  p.innerHTML = '<div class="pencere" style="max-width:560px">'
    + '<h3>' + kacir(m.no) + ' — ' + kacir(m.ad) + '</h3>'
    + (pp ? '<div class="soluk" style="margin:2px 0 10px">'
        + kacir((VDA2.ppap_ad || {})[pp] || ('PPAP ' + pp))
        + (kod ? ' · <b>' + kacir(kod) + '</b> — ' + kacir(KOD_ACIK[kod] || '') : '')
        + '</div>' : '')
    + '<div class="bilgi-kutu"><b>Ne isteniyor?</b><div style="margin-top:4px">'
    + kacir(m.ne || 'Bu madde için müşteriyle kararlaştırılan kanıt sunulur.') + '</div></div>'
    + ((m.ornek || []).length
        ? '<div style="font-size:13px"><b>Örnek belgeler</b><ul style="margin:6px 0 0;padding-left:20px">'
          + m.ornek.map(x => '<li style="margin:3px 0">' + kacir(x) + '</li>').join('') + '</ul></div>'
        : '')
    + (SABLON[m.no] ? '<div class="bilgi-kutu" style="margin-top:10px">📄 Bu madde için '
        + '<b>boş format</b> var — satırdaki “Boş formatı indir” bağlantısını kullanın.</div>' : '')
    + '<div class="dugmeler"><button class="dugme sag" id="mb_kapat">Kapat</button></div></div>';
  document.body.appendChild(p);
  const kapat = () => p.remove();
  p.addEventListener('click', e => { if (e.target === p) kapat(); });
  p.querySelector('#mb_kapat').onclick = kapat;
}

// ── Ortak: madde tablosu ─────────────────────────────────────────────────
// Bos format: kullanicinin KENDI formu Drive'da duruyor, tedarikci
// buradan indirip doldurur ve ayni maddeye geri yukler.
async function sablonIndir(no) {
  const t = SABLON[no]; if (!t) return;
  await dosyaAc({ ad: t.dosya, anahtar: t.anahtar });
}

// PPAP no: AIAG PPAP (4. baski) element karsiligi. VDA numarasi musteriye
// giden formla ayni kalsin diye YERINE gecmiyor, YANINA ekleniyor.
// Katalogdan tek seferde kuruluyor (her satirda arama yapilmasin).
const PPAP_NO = {}, PPAP_KLAUS = {};
(VDA2.maddeler || []).forEach(m => {
  if (m.ppap) PPAP_NO[m.no] = m.ppap;
  if (m.klaus) PPAP_KLAUS[m.no] = m.klaus;   // 2.2.10.1 / 2.2.10.2 gibi alt madde
});
// Tablo 4.2 kodu: S gonderilir, R elde tutulur, * istenirse gonderilir.
// Ic yuzde kapsamin NEDEN oyle oldugu gorunsun diye numaranin yaninda.
let AKTIF_SEVIYE = '3';
const KOD_AD = { S: 'S — müşteriye gönderilir', R: 'R — tedarikçide tutulur, istenirse gösterilir',
                 '*': '* — tedarikçide tutulur, istenirse gönderilir' };
function tablo42Kod(el) {
  const k = ((VDA2.tablo42 || {})[el] || {})[AKTIF_SEVIYE];
  if (!k) return '';
  return '<span class="t42 t42-' + (k === 'S' ? 's' : (k === 'R' ? 'r' : 'y'))
    + '" title="' + kacir(KOD_AD[k] || '') + '">' + kacir(k) + '</span>';
}

function ppapBaslik(no, el) {
  const bas = (VDA2.ppap_ad || {})[el] || '';
  const k = PPAP_KLAUS[no];
  return k ? bas.replace(/^AIAG [\d.]+/, 'AIAG ' + k) : bas;
}

function ilerlemeCubugu(maddeler) {
  const g = maddeler.filter(m => m.gonderim);
  const t = g.filter(m => m.durum === 'kabul' || m.durum === 'yuklendi').length;
  const y = g.length ? Math.round(t * 100 / g.length) : 0;
  return '<div class="ilerleme"><div style="width:' + y + '%"></div></div>'
    + '<div class="soluk"><b>' + t + ' / ' + g.length + '</b> madde tamam'
    + (g.length - t ? ' · <b style="color:var(--uyari)">' + (g.length - t) + ' eksik</b>' : '')
    + '</div>';
}
function maddeSatirlari(maddeler, ic, projeId) {
  const gruplar = {};
  maddeler.forEach(m => { (gruplar[m.grup] = gruplar[m.grup] || []).push(m); });
  let h = '';
  Object.keys(gruplar).sort().forEach(g => {
    const liste = gruplar[g].filter(m => ic || m.gonderim);
    if (!liste.length) return;
    h += '<tr class="grup-bas"><td colspan="' + (ic ? 6 : 5) + '">'
      + kacir(g + '. ' + (VDA2.grup_ad[g] || '')) + '</td></tr>';
    liste.sort((a, b) => a.no.localeCompare(b.no, undefined, { numeric:true }));
    liste.forEach(m => {
      const A = JSON.stringify(m.id).replace(/"/g, '&quot;');
      const pp = PPAP_NO[m.no] || '';
      // Kapsam bir bakista gorunsun: gonderilecek satir acik yesil,
      // yalniz gerekli (elde tutulacak) satir acik amber. Tedarikci
      // yuzunde zaten yalniz gonderilecekler listelendigi icin boyanmaz.
      const sinif = !ic ? '' : (m.gonderim ? ' class="sat-gonder"'
                   : (m.gerekli ? ' class="sat-gerekli"' : ''));
      h += '<tr' + sinif + '><td style="white-space:nowrap"><b>' + kacir(m.no) + '</b></td>'
        + '<td class="ppapno">' + (pp
            ? '<span title="' + kacir(ppapBaslik(m.no, pp)) + '">' + kacir(pp) + '</span>'
              + tablo42Kod(pp)
            : '<span class="soluk">—</span>') + '</td>'
        + '<td><a href="#" style="color:inherit;text-decoration:underline dotted" '
        + 'onclick="maddeBilgi(' + JSON.stringify(m.no).replace(/"/g, '&quot;') + ');return false">'
        + kacir(m.ad) + '</a>'
        + (met(m.yorum) ? '<div class="soluk" style="color:var(--sil)">💬 ' + kacir(m.yorum) + '</div>' : '')
        + (met(m.ted_yorum) ? '<div class="soluk">🗨 ' + kacir(m.ted_yorum) + '</div>' : '')
        + (m.dosyalar || []).map((f, fi) => '<div class="dosya">📎 <a href="#" onclick="dosyaAc('
            + JSON.stringify(f).replace(/"/g, '&quot;') + ');return false">' + kacir(f.ad) + '</a>'
            + '<span class="soluk">' + kb(f.boyut || 0)
            + (met(f.tarih) ? ' · ' + kacir(f.tarih) : '')
            + (met(f.yukleyen) ? ' · ' + kacir(f.yukleyen) : '')
            + '</span>'
            // Tedarikci yanlis dosyayi silip yenisini yukleyebilsin;
            // KABUL edilmis maddede silinemez (onaylanan kanit sabit kalir).
            + (!ic
                ? (m.durum !== 'kabul'
                    ? ' <a href="#" style="color:var(--sil);font-size:12px" onclick="dosyaSil('
                      + JSON.stringify(m.id).replace(/"/g, '&quot;') + ',' + fi + ');return false">sil</a>'
                    : ' <span style="font-size:12px;cursor:help" title="Madde kabul edildi — '
                      + 'onaylanan dosya silinemez. Değişiklik gerekiyorsa Not yazın; kalite '
                      + 'maddeyi redde çekerse silme yeniden açılır.">🔒</span>')
                : '')
            + '</div>').join('')
        + (SABLON[m.no] ? '<div class="dosya">📄 <a href="#" onclick="sablonIndir('
            + JSON.stringify(m.no).replace(/"/g, '&quot;') + ');return false"><b>Boş formatı indir</b> — '
            + kacir(SABLON[m.no].ad) + '</a></div>' : '')
        + (!ic && m.gonderim
            ? (m.durum !== 'kabul'
                ? '<div class="suruk" data-madde="' + kacir(m.id) + '">'
                  + '⬆️ Dosyayı buraya sürükleyin <span class="soluk">veya tıklayıp seçin</span></div>'
                // Kabul edilmis madde: sessizce ustune yukletmiyoruz —
                // acik "Revize et" ile yeniden acilir ve kaliteye onaya duser.
                : '<div style="margin-top:6px"><button class="dugme kucuk duz" '
                  + 'onclick="maddeRevize(' + JSON.stringify(m.id).replace(/"/g, '&quot;') + ')">'
                  + '🔁 Revize et — yeni dosya yükle</button>'
                  + '<span class="soluk" style="margin-left:8px">kabul kalkar, kalite yeniden onaylar</span></div>')
            : '')
        + '</td>'
        + (ic ? '<td style="white-space:nowrap">'
            + '<label class="soluk" style="display:inline-flex;gap:4px;align-items:center;margin:0">'
            + '<input type="checkbox" style="width:auto" ' + (m.gerekli ? 'checked' : '')
            + ' onchange="maddeBayrak(' + A + ',\'gerekli\',this.checked)"> gerekli</label><br>'
            + '<label class="soluk" style="display:inline-flex;gap:4px;align-items:center;margin:0">'
            + '<input type="checkbox" style="width:auto" ' + (m.gonderim ? 'checked' : '')
            + ' onchange="maddeBayrak(' + A + ',\'gonderim\',this.checked)"> gönderilecek</label></td>' : '')
        + '<td><span class="rozet r-' + m.durum + '">' + (MADDE_AD[m.durum] || m.durum) + '</span></td>'
        + '<td style="white-space:nowrap">'
        + (ic
            ? '<button class="dugme kucuk" onclick="maddeKarar(' + A + ',\'kabul\')">✔</button> '
              + '<button class="dugme kucuk duz" onclick="maddeKarar(' + A + ',\'red\')">✖</button>'
            : '<button class="dugme kucuk duz" onclick="tedYorum(' + A + ')">🗨 Not</button>')
        + '</td></tr>';
    });
  });
  return h;
}
</script>
